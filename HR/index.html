<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.jpeg" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>HR Dashboard | HRMS</title>
    <meta
      name="description"
      content="HR dashboard to manage assigned leads, update status, and track progress in HRMS."
    />
    <meta
      name="keywords"
      content="HR Dashboard, Lead Management, HRMS, CRM, Employee System"
    />
    <meta name="author" content="Your Company Name" />

    <!-- Open Graph -->
    <meta property="og:title" content="HR Dashboard | HRMS" />
    <meta
      property="og:description"
      content="Manage your assigned leads and update status efficiently."
    />
    <meta property="og:image" content="/logo.jpeg" />
    <meta property="og:type" content="website" />

    <!-- Optional: block indexing (recommended for dashboards) -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Theme color -->
    <meta name="theme-color" content="#7c3aed" />
    <script>
      (function () {
        try {
          localStorage.removeItem("hrms-theme");
          document.documentElement.classList.remove("dark");
          document.documentElement.setAttribute("data-theme", "light");
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/logo-3d-bounce.css?v=1">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
