services:
  - type: web
    name: ardhnarishwar-global-attendance
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 4 --threads 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PLATFORM_NAME
        value: Ardhnarishwar Global Attendance Platform
      - key: SUPER_ADMIN_COMPANY
        value: Ardhnarishwar Company
      - key: SUPER_ADMIN_EMAIL
        value: superadmin@ardhnarishwar.com
      - key: SUPER_ADMIN_PASS
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: DB_TYPE
        value: mongodb
      - key: DATABASE_NAME
        value: smart_attendance
      # Provide your free MongoDB Atlas URI here on Render Dashboard
      - key: MONGO_URI
        sync: false
