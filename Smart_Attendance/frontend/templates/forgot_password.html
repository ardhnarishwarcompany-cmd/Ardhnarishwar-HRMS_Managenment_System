<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Recovery • Ardhnarishwar Global Platform</title>
<link rel="icon" type="image/png" href="/static/images/ardhnarishwar_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/ardhnarishwar_3d.css">
<style>
.auth-container {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 20px;
  position: relative;
  z-index: 1;
}

.auth-card {
  width: 100%;
  max-width: 460px;
  background: var(--bg-card);
  border: 1px solid var(--border-medium);
  border-radius: var(--radius-xl);
  padding: 36px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(28px);
}
</style>
<link rel="stylesheet" href="/static/css/ardh_logo.css?v=1">
</head>
<body>
<div class="auth-container">
  <div class="auth-card card-3d">
    <div style="margin-bottom:24px; border-bottom:1px solid var(--border-subtle); padding-bottom:16px;">
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
        <div class="ardh-medallion-nav" style="width:44px; height:44px;">
          <img src="/static/images/ardhnarishwar_logo_emblem.png" alt="Ardhnarishwar" class="ardh-medallion-img">
        </div>
        <div>
          <div style="font-size:16px; font-weight:900; background:linear-gradient(135deg, #C084FC, #38BDF8); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">ARDHNARISHWAR</div>
          <div style="font-size:11px; color:var(--cyan); font-family:var(--font-mono);">SECURITY VAULT RECOVERY</div>
        </div>
      </div>
      <h1 style="font-size:22px; font-weight:800; letter-spacing:-0.4px;">Reset Account Password</h1>
      <p style="font-size:13px; color:var(--text-secondary);">Authenticate using your registered contact or in-app vault code</p>
    </div>

    <!-- Step 1: Request Code -->
    <div id="step-1">
      <form onsubmit="handleRequestCode(event)" style="display:flex; flex-direction:column; gap:16px;">
        <div class="form-group">
          <label class="form-label">Registered Phone Number / Email</label>
          <input type="text" id="req-identifier" class="form-input" placeholder="e.g. 9876500001 or admin@company.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Company Workspace ID (Leave blank if Super Admin)</label>
          <input type="text" id="req-comp" class="form-input" placeholder="e.g. ACME" style="text-transform:uppercase; font-family:var(--font-mono);">
        </div>

        <button type="submit" class="btn btn-primary btn-lg" id="btn-step1">
          <span>Issue Verification Code</span> →
        </button>
      </form>
    </div>

    <!-- Step 2: Enter Code & New Password -->
    <div id="step-2" style="display:none;">
      <form onsubmit="handleResetPassword(event)" style="display:flex; flex-direction:column; gap:16px;">
        <div class="form-group">
          <label class="form-label">6-Digit Authorization Code</label>
          <input type="text" id="reset-code" class="form-input" placeholder="123456" style="font-family:var(--font-mono); font-size:18px; letter-spacing:4px; text-align:center;" maxlength="6" required>
        </div>

        <div class="form-group">
          <label class="form-label">New Account Password</label>
          <input type="password" id="new-password" class="form-input" placeholder="Minimum 6 characters" required>
        </div>

        <button type="submit" class="btn btn-emerald btn-lg" id="btn-step2">
          <span>Update Password & Sign In</span> ✓
        </button>
      </form>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--text-muted); margin-top:20px; border-top:1px solid var(--border-subtle); padding-top:14px;">
      <a href="/login" style="color:var(--text-muted); text-decoration:none;">← Return to Sign In</a>
      <a href="/register-company" style="color:var(--cyan); text-decoration:none;">Register Organization</a>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<script>
let savedIdentifier = "";
let savedComp = "";

async function handleRequestCode(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-step1');
  savedIdentifier = document.getElementById('req-identifier').value.trim();
  savedComp = document.getElementById('req-comp').value.trim().toUpperCase();

  btn.disabled = true;
  btn.textContent = 'Generating authorization key...';

  try {
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier: savedIdentifier, company_id: savedComp })
    });
    const data = await res.json();

    if (data.ok) {
      showToast(data.message, 'success');
      if (data.reset_code) {
        // In-app prompt for seamless self-recovery
        alert(`Your In-App Reset Code is: ${data.reset_code}`);
        document.getElementById('reset-code').value = data.reset_code;
      }
      document.getElementById('step-1').style.display = 'none';
      document.getElementById('step-2').style.display = 'block';
    } else {
      showToast(data.error || 'Failed to issue reset code', 'error');
      btn.disabled = false;
      btn.textContent = 'Issue Verification Code →';
    }
  } catch (err) {
    showToast('Network error during reset request', 'error');
    btn.disabled = false;
    btn.textContent = 'Issue Verification Code →';
  }
}

async function handleResetPassword(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-step2');
  const code = document.getElementById('reset-code').value.trim();
  const newPass = document.getElementById('new-password').value.trim();

  btn.disabled = true;
  btn.textContent = 'Updating credentials...';

  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        identifier: savedIdentifier,
        company_id: savedComp,
        reset_code: code,
        new_password: newPass
      })
    });
    const data = await res.json();

    if (data.ok) {
      showToast(data.message, 'success');
      setTimeout(() => { window.location.href = '/login'; }, 1500);
    } else {
      showToast(data.error || 'Reset failed', 'error');
      btn.disabled = false;
      btn.textContent = 'Update Password & Sign In ✓';
    }
  } catch (err) {
    showToast('Network error resetting password', 'error');
    btn.disabled = false;
    btn.textContent = 'Update Password & Sign In ✓';
  }
}

function showToast(msg, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span>${type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ'}</span> <div>${msg}</div>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}
</script>
<script src="/static/js/ardhnarishwar_runtime.js"></script>
<script src="/static/js/ardh_logo.js?v=1"></script>
</body>
</html>
