<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email OTP Attendance • Ardhnarishwar Global Platform</title>
<link rel="icon" type="image/png" href="/static/images/ardhnarishwar_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/ardhnarishwar_3d.css">
<style>
.clockin-container {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  position: relative;
  z-index: 1;
}

.clockin-card {
  width: 100%;
  max-width: 460px;
  background: var(--bg-card);
  border: 1px solid var(--border-medium);
  border-radius: var(--radius-xl);
  padding: 34px;
  box-shadow: var(--shadow-lg);
  backdrop-filter: blur(24px);
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.clockin-header {
  text-align: center;
}

.clockin-icon {
  width: 56px;
  height: 56px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--indigo), var(--cyan));
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  margin-bottom: 12px;
  box-shadow: 0 0 24px var(--glow-indigo);
}

.clockin-header h1 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.3px;
  margin-bottom: 4px;
}

.clockin-header p {
  font-size: 13.5px;
  color: var(--text-secondary);
}

.otp-box {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin: 12px 0;
}

.otp-digit {
  width: 48px;
  height: 56px;
  background: var(--bg-input);
  border: 1px solid var(--border-medium);
  border-radius: var(--radius-sm);
  color: #FFFFFF;
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  outline: none;
  transition: all 0.2s ease;
}

.otp-digit:focus {
  border-color: var(--indigo);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
  background: var(--bg-surface);
}

.emp-badge-bar {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
}
@media (max-width: 520px) {
  .clockin-container { padding: 16px 10px; }
  .clockin-card { padding: 22px 16px; border-radius: 18px; gap: 16px; }
  .clockin-header h1 { font-size: 19px !important; }
  .clockin-header p { font-size: 12px; line-height: 1.5; }
  .emp-badge-bar { flex-direction: column; align-items: flex-start; gap: 8px; }
  .otp-box { gap: 5px; margin: 8px 0; }
  .otp-digit { width: 42px; height: 50px; font-size: 20px; }
}
@media (max-width: 360px) {
  .otp-digit { width: 37px; height: 46px; font-size: 18px; }
  .clockin-card { padding: 18px 12px; }
}
</style>
<link rel="stylesheet" href="/static/css/ardh_logo.css?v=1">
</head>
<body>
<div class="clockin-container">
  <div class="clockin-card card-3d">
    <div class="clockin-header">
      <div style="display:flex; justify-content:center; margin-bottom:12px;">
        <div class="ardh-medallion-nav" style="width:56px; height:56px;">
          <img src="/static/images/ardhnarishwar_logo_emblem.png" alt="Ardhnarishwar Logo" class="ardh-medallion-img">
        </div>
      </div>
      <h1 style="background:linear-gradient(135deg, #C084FC, #38BDF8, #FBBF24); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-size:22px; font-weight:900;">ARDHNARISHWAR EMAIL OTP</h1>
      <p>Secure attendance OTP delivered to the company-authorized HR / Manager email</p>
    </div>

    <div class="emp-badge-bar">
      <div>
        <strong id="emp-name" style="color:var(--text-primary);">Employee</strong>
        <span style="font-family:var(--font-mono); color:var(--cyan); margin-left:6px;" id="emp-id">(EMP)</span>
      </div>
      <div class="badge badge-indigo">
        <span class="badge-dot"></span> <span id="comp-id">COMPANY</span>
      </div>
    </div>

    <!-- Clock-IN / Clock-OUT Selector -->
    <div style="display:flex; background:var(--bg-input); padding:4px; border-radius:var(--radius-sm); border:1px solid var(--border-subtle); margin-bottom:14px;">
      <button type="button" id="toggle-punch-in" onclick="setPunchType('IN')" style="flex:1; padding:8px 12px; border-radius:6px; border:none; font-weight:700; font-size:12.5px; cursor:pointer; background:var(--emerald); color:#fff; display:flex; align-items:center; justify-content:center; gap:6px; transition:all 0.2s;">
        <span>🟢 Clock-IN</span>
      </button>
      <button type="button" id="toggle-punch-out" onclick="setPunchType('OUT')" style="flex:1; padding:8px 12px; border-radius:6px; border:none; font-weight:700; font-size:12.5px; cursor:pointer; background:transparent; color:var(--text-secondary); display:flex; align-items:center; justify-content:center; gap:6px; transition:all 0.2s;">
        <span>🔴 Clock-OUT</span>
      </button>
    </div>

    <!-- Step 1: Send / Generate Code -->
    <div id="step-send">
      <p style="font-size:13px; color:var(--text-muted); text-align:center; margin-bottom:16px;">
        Click below to send a one-time attendance OTP to the company's authorized HR / Manager email.
      </p>
      <button class="btn btn-indigo btn-lg" style="width:100%;" id="btn-request-code" onclick="requestCode()">
        Send OTP to Authorized Email →
      </button>
    </div>

    <!-- Step 2: Enter & Verify Code -->
    <div id="step-verify" style="display:none; flex-direction:column; gap:16px;">
      <div class="otp-box">
        <input type="text" maxlength="1" class="otp-digit" id="d1" oninput="nextInput(this, 'd2')">
        <input type="text" maxlength="1" class="otp-digit" id="d2" oninput="nextInput(this, 'd3')">
        <input type="text" maxlength="1" class="otp-digit" id="d3" oninput="nextInput(this, 'd4')">
        <input type="text" maxlength="1" class="otp-digit" id="d4" oninput="nextInput(this, 'd5')">
        <input type="text" maxlength="1" class="otp-digit" id="d5" oninput="nextInput(this, 'd6')">
        <input type="text" maxlength="1" class="otp-digit" id="d6" oninput="autoSubmitIfComplete()">
      </div>

      <button class="btn btn-primary btn-lg" id="btn-verify" style="width:100%;" onclick="verifyOTP()">
        Verify Code & Mark Attendance →
      </button>

      <div style="display:flex; justify-content:flex-end; align-items:center; font-size:12.5px;">
        <span onclick="requestCode()" style="color:var(--text-muted); cursor:pointer; text-decoration:underline;">
          Resend OTP
        </span>
      </div>
    </div>

    <a href="/employee" class="btn btn-secondary btn-sm" style="text-decoration:none; margin-top:4px;">← Return to Portal</a>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<script>
let currentCompanyId = "";
let currentEmpId = "";
let currentPunchType = "IN";

function setPunchType(type) {
  currentPunchType = type;
  const inBtn = document.getElementById('toggle-punch-in');
  const outBtn = document.getElementById('toggle-punch-out');
  const verifyBtn = document.getElementById('btn-verify');

  if (type === 'OUT') {
    if (inBtn) {
      inBtn.style.background = 'transparent';
      inBtn.style.color = 'var(--text-secondary)';
    }
    if (outBtn) {
      outBtn.style.background = 'var(--rose)';
      outBtn.style.color = '#fff';
    }
    if (verifyBtn && !verifyBtn.disabled) {
      verifyBtn.textContent = 'Verify Code & Clock-OUT →';
    }
  } else {
    if (inBtn) {
      inBtn.style.background = 'var(--emerald)';
      inBtn.style.color = '#fff';
    }
    if (outBtn) {
      outBtn.style.background = 'transparent';
      outBtn.style.color = 'var(--text-secondary)';
    }
    if (verifyBtn && !verifyBtn.disabled) {
      verifyBtn.textContent = 'Verify Code & Clock-IN →';
    }
  }
}

async function initPage() {
  const urlParams = new URLSearchParams(window.location.search);
  const modeParam = (urlParams.get('mode') || '').toUpperCase();
  if (modeParam === 'OUT') {
    setPunchType('OUT');
  } else {
    setPunchType('IN');
  }

  try {
    const res = await fetch('/api/me');
    const data = await res.json();
    if (data.ok && data.user) {
      currentCompanyId = data.user.company_id || "";
      currentEmpId = data.user.emp_id || "";
      document.getElementById('emp-name').textContent = data.user.name;
      document.getElementById('emp-id').textContent = `(${currentEmpId})`;
      document.getElementById('comp-id').textContent = currentCompanyId;
    }
  } catch (err) {}
}

async function requestCode() {
  const btn = document.getElementById('btn-request-code');
  btn.textContent = 'Sending OTP to authorized email...';
  btn.disabled = true;

  try {
    const res = await fetch('/api/attendance/otp-send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ company_id: currentCompanyId, emp_id: currentEmpId })
    });
    const data = await res.json();
    if (data.ok) {
      document.getElementById('step-send').style.display = 'none';
      const verifyStep = document.getElementById('step-verify');
      verifyStep.style.display = 'flex';
      showToast(`${data.message} ${data.recipients ? '(' + data.recipients.join(', ') + ')' : ''}`, 'success');
      document.getElementById('d1').focus();
    } else {
      showToast(data.error || 'Failed to generate code', 'error');
      btn.disabled = false;
      btn.textContent = 'Send OTP to Authorized Email →';
    }
  } catch (err) {
    showToast('Server communication failure', 'error');
    btn.disabled = false;
    btn.textContent = 'Send OTP to Authorized Email →';
  }
}

function nextInput(current, nextId) {
  if (current.value.length === 1 && nextId) {
    document.getElementById(nextId).focus();
  }
}

function autoSubmitIfComplete() {
  const code = getEnteredCode();
  if (code.length === 6) {
    verifyOTP();
  }
}

function getEnteredCode() {
  let s = '';
  for (let i = 1; i <= 6; i++) {
    s += document.getElementById(`d${i}`).value.trim();
  }
  return s;
}



async function verifyOTP() {
  const code = getEnteredCode();
  if (code.length !== 6) {
    showToast('Please enter all 6 digits of your verification code', 'error');
    return;
  }

  const btn = document.getElementById('btn-verify');
  btn.textContent = 'Verifying...';
  btn.disabled = true;

  try {
    const res = await fetch('/api/attendance/otp-verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        company_id: currentCompanyId,
        emp_id: currentEmpId,
        otp: code,
        check_type: currentPunchType
      })
    });
    const data = await res.json();

    if (data.ok) {
      showToast(data.message, 'success');
      btn.textContent = `Clock-${currentPunchType} Verified ✓`;
      setTimeout(() => { window.location.href = '/employee'; }, 2000);
    } else {
      showToast(data.error || 'Code verification failed', 'error');
      btn.disabled = false;
      btn.textContent = `Verify Code & Clock-${currentPunchType} →`;
    }
  } catch (err) {
    showToast('Network error verifying code', 'error');
    btn.disabled = false;
    btn.textContent = `Verify Code & Clock-${currentPunchType} →`;
  }
}

function showToast(msg, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span>${type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ'}</span> <div>${msg}</div>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

window.onload = initPage;
</script>
<script src="/static/js/theme.js"></script>
<script src="/static/js/telemetry.js"></script>
<script src="/static/js/ardhnarishwar_runtime.js"></script>
<script src="/static/js/ardh_logo.js?v=1"></script>
</body>
</html>
