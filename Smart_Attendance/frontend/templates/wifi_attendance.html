<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Wi-Fi Clock-In • Ardhnarishwar Global Platform</title>
<link rel="icon" type="image/png" href="/static/images/ardhnarishwar_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/ardhnarishwar_3d.css">
<style>
.clockin-container {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  position: relative;
  z-index: 1;
}

.clockin-card {
  width: 100%;
  max-width: 460px;
  background: var(--bg-card);
  border: 1px solid var(--border-medium);
  border-radius: var(--radius-xl);
  padding: 34px;
  box-shadow: var(--shadow-lg);
  backdrop-filter: blur(24px);
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.clockin-header {
  text-align: center;
}

.clockin-icon {
  width: 56px;
  height: 56px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--cyan), var(--blue));
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  margin-bottom: 12px;
  box-shadow: 0 0 24px var(--glow-cyan);
}

.clockin-header h1 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.3px;
  margin-bottom: 4px;
}

.clockin-header p {
  font-size: 13.5px;
  color: var(--text-secondary);
}

.network-gauge {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.gauge-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
}

.emp-badge-bar {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
}
</style>
<link rel="stylesheet" href="/static/css/ardh_logo.css?v=1">
</head>
<body>
<div class="clockin-container">
  <div class="clockin-card card-3d">
    <div class="clockin-header">
      <div style="display:flex; justify-content:center; margin-bottom:12px;">
        <div class="ardh-medallion-nav" style="width:56px; height:56px;">
          <img src="/static/images/ardhnarishwar_logo_emblem.png" alt="Ardhnarishwar Logo" class="ardh-medallion-img">
        </div>
      </div>
      <h1 style="background:linear-gradient(135deg, #C084FC, #38BDF8, #FBBF24); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-size:22px; font-weight:900;">ARDHNARISHWAR WI-FI CLOCK-IN</h1>
      <p>Authorized corporate office network verification</p>
    </div>

    <div class="emp-badge-bar">
      <div>
        <strong id="emp-name" style="color:var(--text-primary);">Employee</strong>
        <span style="font-family:var(--font-mono); color:var(--cyan); margin-left:6px;" id="emp-id">(EMP)</span>
      </div>
      <div class="badge badge-cyan">
        <span class="badge-dot"></span> <span id="comp-id">COMPANY</span>
      </div>
    </div>

    <!-- Clock-IN / Clock-OUT Selector -->
    <div style="display:flex; background:var(--bg-input); padding:4px; border-radius:var(--radius-sm); border:1px solid var(--border-subtle); margin-bottom:14px;">
      <button type="button" id="toggle-punch-in" onclick="setPunchType('IN')" style="flex:1; padding:8px 12px; border-radius:6px; border:none; font-weight:700; font-size:12.5px; cursor:pointer; background:var(--emerald); color:#fff; display:flex; align-items:center; justify-content:center; gap:6px; transition:all 0.2s;">
        <span>🟢 Clock-IN</span>
      </button>
      <button type="button" id="toggle-punch-out" onclick="setPunchType('OUT')" style="flex:1; padding:8px 12px; border-radius:6px; border:none; font-weight:700; font-size:12.5px; cursor:pointer; background:transparent; color:var(--text-secondary); display:flex; align-items:center; justify-content:center; gap:6px; transition:all 0.2s;">
        <span>🔴 Clock-OUT</span>
      </button>
    </div>

    <div class="network-gauge">
      <div class="gauge-row">
        <span style="color:var(--text-muted);">Device IP Address:</span>
        <span style="font-family:var(--font-mono); color:var(--cyan);" id="client-ip">Inspecting...</span>
      </div>
      <div class="gauge-row">
        <span style="color:var(--text-muted);">Network Subnet:</span>
        <span style="font-family:var(--font-mono); color:var(--text-primary);" id="client-subnet">Inspecting...</span>
      </div>
      <div class="gauge-row" style="margin-top:6px; border-top:1px solid var(--border-subtle); padding-top:10px;">
        <span style="color:var(--text-muted);">Office Network Status:</span>
        <span class="badge badge-emerald" id="net-status-badge">
          <span class="badge-dot"></span> Verified Subnet
        </span>
      </div>
    </div>

    <button class="btn btn-primary btn-lg" id="btn-clockin" onclick="markWifiAttendance()">
      Record Wi-Fi Attendance →
    </button>

    <a href="/employee" class="btn btn-secondary btn-sm" style="text-decoration:none; margin-top:4px;">← Return to Portal</a>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<script>
let currentCompanyId = "";
let currentEmpId = "";
let currentPunchType = "IN";

function setPunchType(type) {
  currentPunchType = type;
  const inBtn = document.getElementById('toggle-punch-in');
  const outBtn = document.getElementById('toggle-punch-out');
  const clockBtn = document.getElementById('btn-clockin');

  if (type === 'OUT') {
    if (inBtn) {
      inBtn.style.background = 'transparent';
      inBtn.style.color = 'var(--text-secondary)';
    }
    if (outBtn) {
      outBtn.style.background = 'var(--rose)';
      outBtn.style.color = '#fff';
    }
    if (clockBtn && !clockBtn.disabled) {
      clockBtn.textContent = 'Record Wi-Fi Clock-OUT →';
    }
  } else {
    if (inBtn) {
      inBtn.style.background = 'var(--emerald)';
      inBtn.style.color = '#fff';
    }
    if (outBtn) {
      outBtn.style.background = 'transparent';
      outBtn.style.color = 'var(--text-secondary)';
    }
    if (clockBtn && !clockBtn.disabled) {
      clockBtn.textContent = 'Record Wi-Fi Clock-IN →';
    }
  }
}

async function initPage() {
  const urlParams = new URLSearchParams(window.location.search);
  const modeParam = (urlParams.get('mode') || '').toUpperCase();
  if (modeParam === 'OUT') {
    setPunchType('OUT');
  } else {
    setPunchType('IN');
  }

  try {
    const res = await fetch('/api/me');
    const data = await res.json();
    if (data.ok && data.user) {
      currentCompanyId = data.user.company_id || "";
      currentEmpId = data.user.emp_id || "";
      document.getElementById('emp-name').textContent = data.user.name;
      document.getElementById('emp-id').textContent = `(${currentEmpId})`;
      document.getElementById('comp-id').textContent = currentCompanyId;
    }
  } catch (err) {}

  await checkNetwork();
}

async function checkNetwork() {
  try {
    const res = await fetch(`/api/network-status?company_id=${currentCompanyId}`);
    const data = await res.json();
    const ip = data.client_ip || '127.0.0.1';
    document.getElementById('client-ip').textContent = ip;
    document.getElementById('client-subnet').textContent = ip.split('.').slice(0, 3).join('.') + '.*';

    const badge = document.getElementById('net-status-badge');
    if (data.on_office_wifi) {
      badge.className = 'badge badge-emerald';
      badge.innerHTML = '<span class="badge-dot"></span> Authorized Office Network';
    } else {
      badge.className = 'badge badge-rose';
      badge.innerHTML = '<span class="badge-dot"></span> External Network Subnet';
    }
  } catch (err) {
    console.error('Network check error:', err);
  }
}

async function markWifiAttendance() {
  const btn = document.getElementById('btn-clockin');
  btn.textContent = 'Verifying Network...';
  btn.disabled = true;

  try {
    const res = await fetch('/api/attendance/mark-wifi', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        company_id: currentCompanyId, 
        emp_id: currentEmpId,
        check_type: currentPunchType 
      })
    });
    const data = await res.json();

    if (data.ok) {
      showToast(data.message, 'success');
      btn.textContent = `Clock-${currentPunchType} Recorded ✓`;
      setTimeout(() => { window.location.href = '/employee'; }, 2000);
    } else {
      showToast(data.error || 'Wi-Fi attendance failed', 'error');
      btn.disabled = false;
      btn.textContent = `Record Wi-Fi Clock-${currentPunchType} →`;
    }
  } catch (err) {
    showToast('Network communication failure', 'error');
    btn.disabled = false;
    btn.textContent = `Record Wi-Fi Clock-${currentPunchType} →`;
  }
}

function showToast(msg, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span>${type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ'}</span> <div>${msg}</div>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

window.onload = initPage;
</script>
<script src="/static/js/theme.js"></script>
<script src="/static/js/telemetry.js"></script>
<script src="/static/js/ardhnarishwar_runtime.js"></script>
<script src="/static/js/ardh_logo.js?v=1"></script>
</body>
</html>
