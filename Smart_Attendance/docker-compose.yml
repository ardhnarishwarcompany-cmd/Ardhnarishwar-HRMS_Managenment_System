version: '3.8'

# ══════════════════════════════════════════════════════════════════════════════
#  ARDHNARISHWAR GLOBAL ATTENDANCE PLATFORM — DOCKER COMPOSE ORCHESTRATION
# ══════════════════════════════════════════════════════════════════════════════

services:
  web:
    build: .
    container_name: ardhnarishwar_attendance_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - DB_TYPE=mysql
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_DATABASE=smart_attendance
      - MYSQL_FALLBACK=True
      - MONGO_URI=mongodb://mongo:27017/
      - DATABASE_NAME=smart_attendance
      - PLATFORM_NAME=Ardhnarishwar Global Attendance Platform
      - SUPER_ADMIN_COMPANY=Ardhnarishwar Company
      - SUPER_ADMIN_EMAIL=superadmin@ardhnarishwar.com
      - SUPER_ADMIN_PASS=superadmin123
      - SECRET_KEY=ardhnarishwar_global_production_secret_2026_key
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - attendance_net

  mysql:
    image: mysql:8.0
    container_name: ardhnarishwar_attendance_mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=smart_attendance
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - attendance_net

  mongo:
    image: mongo:7.0
    container_name: ardhnarishwar_attendance_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - attendance_net

volumes:
  mysql_data:
    driver: local
  mongo_data:
    driver: local

networks:
  attendance_net:
    driver: bridge
